<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.08); opacity: 0.2; }
        100% { transform: scale(0.95); opacity: 0.7; }
      }
      @keyframes ecg-anim {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badge-glow {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.8)); }
      }
      .floating-element { animation: float 6s ease-in-out infinite; }
      .floating-delayed { animation: float 7s ease-in-out 1.5s infinite; }
      .pulse-circle { transform-origin: 50px 50px; animation: pulse-ring 4s ease-in-out infinite; }
      .ecg-line {
        stroke-dasharray: 1200;
        animation: ecg-anim 4s linear infinite;
      }
      .badge-container { animation: badge-glow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="1050" cy="180" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Animated ECG / Pulse Wave Line across the bottom -->
  <path class="ecg-line" d="M 0 310 L 200 310 L 240 310 L 255 285 L 270 335 L 285 260 L 305 345 L 320 295 L 335 310 L 520 310 L 540 310 L 555 285 L 570 335 L 585 260 L 605 345 L 620 295 L 635 310 L 820 310 L 840 310 L 855 285 L 870 335 L 885 260 L 905 345 L 920 295 L 935 310 L 1200 310" 
        fill="none" stroke="url(#primary-grad)" stroke-width="2.5" opacity="0.4" />

  <!-- Left Healthcare Icon Symbol (Cross & Heart Pulse) -->
  <g class="floating-element" transform="translate(100, 110)">
    <circle cx="50" cy="50" r="48" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#soft-glow)" />
    <circle cx="50" cy="50" r="58" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="pulse-circle" />
    <rect x="42" y="24" width="16" height="52" rx="4" fill="url(#primary-grad)" />
    <rect x="24" y="42" width="52" height="16" rx="4" fill="url(#primary-grad)" />
    <circle cx="50" cy="50" r="4" fill="#ffffff" filter="url(#soft-glow)" />
  </g>

  <!-- Main Banner Header Content -->
  <g transform="translate(240, 85)">
    <!-- Category Badge -->
    <g class="badge-container" transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#10b981" />
      <text x="30" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">
        CURATED HEALTHCARE ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#soft-glow)">
      Awesome Patient Engagement
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
      Enterprise SaaS Platforms • FHIR-Native Portals • Open-Source Healthcare Stack
    </text>

    <!-- Tagline and Keywords -->
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Digital Front Doors ✦ Scheduling &amp; Intake ✦ Telehealth ✦ Care Navigation ✦ Conversational AI
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🏥 30+ SaaS Solutions</text>

      <rect x="142" y="0" width="155" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="154" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ 25+ Open-Source Apps</text>

      <rect x="309" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="321" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔥 FHIR R4 &amp; SMART</text>

      <rect x="456" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="468" y="17" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 AI Clinical Agents</text>
    </g>
  </g>

  <!-- Right Floating Tech Elements -->
  <g class="floating-delayed" transform="translate(1010, 85)">
    <rect x="0" y="0" width="120" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" opacity="0.9" />
    <text x="16" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">FHIR ECOSYSTEM</text>
    <text x="16" y="52" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">HL7 / SMART</text>
    <line x1="16" y1="62" x2="104" y2="62" stroke="#334155" stroke-width="1" />
    <text x="16" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">INTEGRATIONS</text>
    <text x="16" y="100" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">EHR &amp; Telehealth</text>
    <line x1="16" y1="110" x2="104" y2="110" stroke="#334155" stroke-width="1" />
    <text x="16" y="128" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">STATUS</text>
    <text x="16" y="142" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Curated 2026</text>
  </g>
</svg>